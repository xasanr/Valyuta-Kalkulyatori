<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>1. Valyuta Kalkulyatori</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #eef2f3; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .result { font-size: 20px; font-weight: bold; color: #2c3e50; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>So'm -> USD</h3>
        <input type="number" id="sum" placeholder="So'm miqdorini kiriting" oninput="convert()">
        <div class="result" id="usd">0 $</div>
    </div>
    <script>
        function convert() {
            const sum = document.getElementById('sum').value;
            const rate = 12800; // 1 USD kursi
            const result = sum ? (sum / rate).toFixed(2) : 0;
            document.getElementById('usd').innerText = result + " $";
        }
    </script>
</body>
</html>
